# Development happens on Windows, where the iOS toolchain does not exist.
# These workflows run on Codemagic's macOS instances and are the only place the
# iOS side of this app is ever compiled.
workflows:

  # ── iOS smoke test ────────────────────────────────────────────────────────
  # Answers one question: does the app still compile for iOS? Needs no Apple
  # Developer account, because nothing is signed. Run this after any change
  # that touches dependencies, shaders, or platform channels.
  ios-smoke:
    name: iOS build check (unsigned)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - flutter_drive.log

  # ── iOS sideload build ────────────────────────────────────────────────────
  # Produces an unsigned .ipa for Sideloadly on Windows, which signs it with a
  # free Apple ID and installs it on a USB-connected iPhone (the signature
  # lasts 7 days). Started by hand from the Codemagic UI: there is no push
  # trigger, so the 500 free macOS minutes a month go only to builds someone
  # asked for. Analyze and test are left to ios-smoke to keep each run short.
  # Flutter is pinned to the version used on the Windows machine, so the phone
  # runs the same engine the Android builds were checked on.
  ios-sideload:
    name: iOS .ipa for Sideloadly (unsigned)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.3
      xcode: latest
    scripts:
      - name: Use a test bundle id
        # A free Apple ID registers whatever bundle id it signs under the
        # user's personal team. Signing a throwaway id keeps
        # az.guvenfinans.mobile free for the company's App Store account.
        # Only this cloud checkout changes; the repo keeps the real id. The
        # grep fails the build if the replacement ever stops matching.
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = az\.guvenfinans\.mobile;/PRODUCT_BUNDLE_IDENTIFIER = az.guvenfinans.mobile.sideload;/' ios/Runner.xcodeproj/project.pbxproj
          grep -c 'PRODUCT_BUNDLE_IDENTIFIER = az.guvenfinans.mobile.sideload;' ios/Runner.xcodeproj/project.pbxproj
      - name: Resolve dependencies
        script: flutter pub get
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package .ipa
        # An .ipa is just Runner.app inside a Payload folder, zipped.
        script: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry guven_finans_sideload.ipa Payload
    artifacts:
      - guven_finans_sideload.ipa

  # ── Android release ───────────────────────────────────────────────────────
  # Runs on Linux (cheaper, faster). Produces an unsigned AAB — wire up a real
  # keystore before shipping to Play.
  android-release:
    name: Android release (AAB)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      # `--obfuscate` renames every Dart class and function in the shipped
      # binary, so a decompiler shows `a.b()` instead of `TokenStore.save()`.
      # It does not hide string literals — the API address and endpoint paths
      # stay readable — so nothing secret may ever be put in the app's code.
      # The symbols it strips out go to build/symbols and are kept as an
      # artifact: `flutter symbolize` needs that exact build's copy to turn a
      # crash stack trace back into names.
      - name: Build app bundle
        script: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/symbols/**

# ── Next step: signed iOS build → TestFlight ─────────────────────────────────
# Requires an Apple Developer Program membership ($99/yr). Once that exists,
# add an `ios-release` workflow with:
#
#   environment:
#     ios_signing:
#       distribution_type: app_store
#       bundle_identifier: az.guvenfinans.mobile
#     groups:
#       - appstore_credentials      # App Store Connect API key, added in the
#                                   # Codemagic UI — never committed here
#   scripts:
#     - name: Set up signing
#       script: xcode-project use-profiles
#     - name: Build ipa
#       script: flutter build ipa --release
#             --obfuscate --split-debug-info=build/symbols
#             --export-options-plist=/Users/builder/export_options.plist
#   publishing:
#     app_store_connect:
#       auth: integration
#       submit_to_testflight: true
#
# Note: `xcode-project use-profiles` generates export_options.plist at that
# path — this is why the repo has no checked-in ExportOptions.plist.
