#       script: xcode-project use-profiles
#     - name: Build ipa
#       script: flutter build ipa --release
#             --export-options-plist=/Users/builder/export_options.plist
#   publishing:
#     app_store_connect:
#       auth: integration
#       submit_to_testflight: true
#
# Note: `xcode-project use-profiles` generates export_options.plist at that
# path — this is why the repo has no checked-in ExportOptions.plist.
