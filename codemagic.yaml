# Development happens on Windows, where the iOS toolchain does not exist.
# These workflows run on Codemagic's macOS instances and are the only place the
# iOS side of this app is ever compiled.
workflows:

  # ── iOS smoke test ────────────────────────────────────────────────────────
  # Answers one question: does the app still compile for iOS? Needs no Apple
  # Developer account, because nothing is signed. Run this after any change
  # that touches dependencies, shaders, or platform channels.
  ios-smoke:
    name: iOS build check (unsigned)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - flutter_drive.log

  # ── Android release ───────────────────────────────────────────────────────
  # Runs on Linux (cheaper, faster). Produces an unsigned AAB — wire up a real
  # keystore before shipping to Play.
  android-release:
    name: Android release (AAB)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build app bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab

# ── Next step: signed iOS build → TestFlight ─────────────────────────────────
# Requires an Apple Developer Program membership ($99/yr). Once that exists,
