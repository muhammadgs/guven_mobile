<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Four lobes in a 2x2 grid around a core disc. One quadrant is drawn and
     mirrored three times, so all four come out exactly congruent.
     The numbers: the art keeps a 1.4 keyline margin (1.4..22.6), a 1.4 channel
     splits the lobes, their outer corners are r=3.45, the core is r=4, and a
     bite of r=5.25 about the centre leaves a 1.25 ring of air around it. Each
     straight edge runs into its bite through an r=0.8 fillet, so the nubs are
     tangent rather than pointed.
     Pairs with menu_open.svg: the same numbers offset by half a stroke, so the
     two glyphs are the same size and cross-fade in register. -->
<g fill="black">
<path d="M4.85 1.4H7.85A3.45 3.45 0 0 1 11.3 4.85V6.1389A0.8 0.8 0 0 1 10.6983 6.9139A5.25 5.25 0 0 0 6.9139 10.6983A0.8 0.8 0 0 1 6.1389 11.3H4.85A3.45 3.45 0 0 1 1.4 7.85V4.85A3.45 3.45 0 0 1 4.85 1.4Z"/>
<g transform="translate(24,0) scale(-1,1)"><path d="M4.85 1.4H7.85A3.45 3.45 0 0 1 11.3 4.85V6.1389A0.8 0.8 0 0 1 10.6983 6.9139A5.25 5.25 0 0 0 6.9139 10.6983A0.8 0.8 0 0 1 6.1389 11.3H4.85A3.45 3.45 0 0 1 1.4 7.85V4.85A3.45 3.45 0 0 1 4.85 1.4Z"/></g>
<g transform="translate(0,24) scale(1,-1)"><path d="M4.85 1.4H7.85A3.45 3.45 0 0 1 11.3 4.85V6.1389A0.8 0.8 0 0 1 10.6983 6.9139A5.25 5.25 0 0 0 6.9139 10.6983A0.8 0.8 0 0 1 6.1389 11.3H4.85A3.45 3.45 0 0 1 1.4 7.85V4.85A3.45 3.45 0 0 1 4.85 1.4Z"/></g>
<g transform="translate(24,24) scale(-1,-1)"><path d="M4.85 1.4H7.85A3.45 3.45 0 0 1 11.3 4.85V6.1389A0.8 0.8 0 0 1 10.6983 6.9139A5.25 5.25 0 0 0 6.9139 10.6983A0.8 0.8 0 0 1 6.1389 11.3H4.85A3.45 3.45 0 0 1 1.4 7.85V4.85A3.45 3.45 0 0 1 4.85 1.4Z"/></g>
<circle cx="12" cy="12" r="4"/>
</g>
</svg>
